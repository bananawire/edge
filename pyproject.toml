[project]
name = "edge-service"
version = "0.1.0"
description = "IoT edge service for smart band health telemetry ingestion"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "libsql>=0.1.11",
    "peewee>=4.0.5",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.0.1",
    "waitress>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
