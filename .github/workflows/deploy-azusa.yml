name: Deploy Clair Edge

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-clair-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Clair Edge
    runs-on: [self-hosted, clair-edge]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Publish Application to /clair/edge
        run: |
          tar --exclude=__pycache__ --exclude='*/__pycache__' --exclude=clair_edge.db -cf - \
            app.py pyproject.toml uv.lock iam device provisioning alerting shared \
            | tar --no-same-owner --no-same-permissions --no-overwrite-dir -xf - -C /clair/edge
          install -m 600 /dev/null /clair/edge/.env
          echo "${{ secrets.EDGE_ENV }}" > /clair/edge/.env
          nix develop -c uv sync --frozen --directory /clair/edge

      - name: Wait for Edge Health
        run: |
          sleep 5
          for i in $(seq 1 30); do
            if nix develop -c curl -fsS http://127.0.0.1:49221/health | grep -q '"status":"UP"'; then
              echo "Edge started successfully."
              exit 0
            fi
            sleep 2
          done
          echo "Error: the edge did not become healthy."
          exit 1
